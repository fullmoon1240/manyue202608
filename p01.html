<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI新品机会雷达 · 01</title>
  <style>
:root {
  --bg: #07111F;
  --bg-soft: #0C1728;
  --surface: #101D30;
  --surface-2: #15243A;
  --text: #F5F8FC;
  --muted: #9CB0C5;
  --subtle: #60738A;
  --accent: #35D0BA;
  --accent-soft: #183D3A;
  --success: #54D98C;
  --warning: #F4B860;
  --danger: #FF7171;
  --line: #263952;
  --white: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.28);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 40px;
  --space-1: 12px;
  --space-2: 20px;
  --space-3: 32px;
  --space-4: 48px;
  --space-5: 72px;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, monospace;
}

    /* 基调：深海蓝背景、青绿色为唯一主强调色；高层阅读型、低装饰、强对齐。 */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .stage {
      position: relative;
      width: 1920px;
      min-height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background:
        radial-gradient(circle at 74% 48%, var(--accent-soft) 0, var(--bg) 31%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-soft) 100%);
    }
    .frame {
      position: absolute;
      inset: 52px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .topline {
      position: absolute;
      top: 78px;
      left: 96px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .topline::before {
      content: "";
      width: 48px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .hero {
      position: absolute;
      z-index: 3;
      left: 112px;
      top: 205px;
      width: 940px;
    }
    .product-name {
      margin: 0 0 30px;
      color: var(--accent);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 0;
      max-width: 920px;
      font-size: 78px;
      line-height: 1.12;
      letter-spacing: -0.035em;
      font-weight: 760;
    }
    h1 .quiet { color: var(--muted); }
    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: 42px;
      padding: 14px 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 24px;
      line-height: 1.3;
    }
    .subtitle::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 20px var(--accent);
    }
    .statement {
      position: absolute;
      z-index: 3;
      left: 112px;
      bottom: 136px;
      max-width: 850px;
      display: grid;
      grid-template-columns: 6px 1fr;
      gap: var(--space-2);
      align-items: stretch;
    }
    .statement-bar {
      border-radius: 999px;
      background: var(--accent);
    }
    .statement strong {
      display: block;
      margin-bottom: 10px;
      color: var(--text);
      font-size: 26px;
      line-height: 1.3;
    }
    .statement p {
      margin: 0;
      max-width: 810px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.55;
    }
    .signal-field {
      position: absolute;
      z-index: 1;
      right: 82px;
      top: 176px;
      width: 800px;
      height: 620px;
    }
    .signal-field svg { width: 100%; height: 100%; }
    .signal-path {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
    }
    .signal-path.key {
      stroke: var(--accent);
      stroke-width: 4;
    }
    .signal-node { fill: var(--subtle); }
    .signal-node.key { fill: var(--accent); }
    .signal-core {
      fill: var(--accent);
      stroke: var(--text);
      stroke-width: 3;
    }
    .boundary {
      position: absolute;
      z-index: 4;
      right: 112px;
      bottom: 130px;
      width: 570px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-1);
    }
    .boundary-item {
      min-height: 118px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .boundary-item b {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 28px;
      line-height: 1;
    }
    .boundary-item span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.3;
    }
    .nav {
      position: absolute;
      z-index: 6;
      right: 88px;
      top: 78px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.08em;
    }
    .page-no { color: var(--muted); }
    .nav-link,
    .nav-disabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 16px;
      text-decoration: none;
    }
    .nav-link {
      color: var(--text);
      background: var(--surface);
    }
    .nav-disabled {
      color: var(--subtle);
      background: var(--bg-soft);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame" aria-hidden="true"></div>

    <div class="topline">AI OPPORTUNITY RESEARCH · MVP</div>

    <nav class="nav" aria-label="演示文稿导航">
      <span class="page-no">01 / 11</span>
      <span class="nav-disabled" aria-disabled="true">← 上一页</span>
      <a class="nav-link" href="p02.html">下一页 →</a>
    </nav>

    <main class="hero">
      <p class="product-name">AI新品机会雷达</p>
      <h1>先证明机会研究有效，<br><span class="quiet">再决定要不要建雷达</span></h1>
      <div class="subtitle">五天公开证据研究验证包</div>
    </main>

    <div class="signal-field" aria-hidden="true">
      <svg viewBox="0 0 800 620" role="img">
        <path class="signal-path" d="M26 66 C240 66 350 200 548 304"></path>
        <path class="signal-path" d="M60 176 C268 176 360 242 548 304"></path>
        <path class="signal-path key" d="M8 302 C230 302 374 302 548 304"></path>
        <path class="signal-path" d="M62 426 C260 426 370 360 548 304"></path>
        <path class="signal-path" d="M12 552 C234 552 362 404 548 304"></path>
        <path class="signal-path key" d="M548 304 C640 304 706 304 772 304"></path>
        <circle class="signal-node" cx="26" cy="66" r="8"></circle>
        <circle class="signal-node" cx="60" cy="176" r="8"></circle>
        <circle class="signal-node key" cx="8" cy="302" r="10"></circle>
        <circle class="signal-node" cx="62" cy="426" r="8"></circle>
        <circle class="signal-node" cx="12" cy="552" r="8"></circle>
        <circle class="signal-core" cx="548" cy="304" r="18"></circle>
        <circle class="signal-node key" cx="772" cy="304" r="9"></circle>
      </svg>
    </div>

    <section class="statement" aria-label="核心范围说明">
      <div class="statement-bar" aria-hidden="true"></div>
      <div>
        <strong>不是先建持续系统</strong>
        <p>一名研究者，仅用无需登录、无需付费的公开资料，验证能否形成可回源的机会假设与唯一下一步决定。</p>
      </div>
    </section>

    <section class="boundary" aria-label="研究边界">
      <div class="boundary-item"><b>5 天</b><span>研究窗口</span></div>
      <div class="boundary-item"><b>公开数据</b><span>无需登录付费</span></div>
      <div class="boundary-item"><b>国内天猫</b><span>猫狗用品</span></div>
    </section>
  </div>
  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();

    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowRight') location.href = 'p02.html';
    });
  </script>
</body>
</html>
