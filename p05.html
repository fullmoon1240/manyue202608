<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一条七步研究路径，把模糊搜索变成可冻结结果</title>
  <style>
    :root {
  --bg: #07111F;
  --bg-soft: #0C1728;
  --surface: #101D30;
  --surface-2: #15243A;
  --text: #F5F8FC;
  --muted: #9CB0C5;
  --subtle: #60738A;
  --accent: #35D0BA;
  --accent-soft: #183D3A;
  --success: #54D98C;
  --warning: #F4B860;
  --danger: #FF7171;
  --line: #263952;
  --white: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.28);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 40px;
  --space-1: 12px;
  --space-2: 20px;
  --space-3: 32px;
  --space-4: 48px;
  --space-5: 72px;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, monospace;
}

    /* 基调：深海蓝背景、青绿色为唯一主强调色；高层阅读型、低装饰、强对齐。 */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .stage {
      width: 1920px;
      min-height: 1080px;
      transform-origin: top left;
      position: relative;
      overflow: hidden;
      padding: 68px 96px 54px;
      background:
        radial-gradient(circle at 50% 42%, var(--accent-soft), transparent 42%),
        linear-gradient(145deg, var(--bg), var(--bg-soft));
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: linear-gradient(90deg, transparent 49%, var(--line) 50%, transparent 51%);
      background-size: 240px 100%;
      mask-image: linear-gradient(to bottom, transparent 8%, var(--bg) 38%, transparent 92%);
    }
    main { position: relative; z-index: 1; }
    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    h1 {
      max-width: 1600px;
      margin: 0;
      font-size: 66px;
      line-height: 1.12;
      letter-spacing: -.035em;
      font-weight: 760;
    }
    h1 em { color: var(--accent); font-style: normal; }
    .scope {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 28px;
      color: var(--muted);
      font-size: 23px;
      line-height: 1.3;
    }
    .scope strong { color: var(--text); font-weight: 650; }
    .scope-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--subtle);
    }
    .process-wrap {
      position: relative;
      margin-top: 70px;
      padding: 0 6px;
    }
    .rail {
      position: absolute;
      left: 106px;
      right: 106px;
      top: 52px;
      height: 4px;
      background: var(--line);
    }
    .rail::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, var(--accent), var(--success));
      opacity: .62;
    }
    .steps {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 22px;
    }
    .step {
      min-width: 0;
      text-align: center;
    }
    .step-mark {
      width: 106px;
      height: 106px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border: 3px solid var(--accent);
      border-radius: 50%;
      background: var(--bg-soft);
      box-shadow: 0 18px 44px var(--shadow);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 800;
    }
    .step:nth-child(2) .step-mark { border-color: var(--warning); color: var(--warning); }
    .step:nth-child(6) .step-mark,
    .step:nth-child(7) .step-mark { border-color: var(--success); color: var(--success); }
    .step h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
    }
    .step p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.3;
    }
    .quota {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 46px;
    }
    .quota span {
      padding: 12px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 22px;
      line-height: 1.2;
    }
    .quota strong { color: var(--text); }
    .failure-route {
      width: 610px;
      margin: 42px 0 0 146px;
      position: relative;
      padding: 25px 28px 25px 32px;
      border: 1px solid var(--warning);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 22px 46px var(--shadow);
    }
    .failure-route::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 48px;
      left: 97px;
      top: -49px;
      background: var(--warning);
    }
    .failure-route::after {
      content: "";
      position: absolute;
      left: 89px;
      top: -9px;
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-top: 14px solid var(--warning);
    }
    .failure-label {
      margin: 0 0 9px;
      color: var(--warning);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 750;
      letter-spacing: .08em;
    }
    .failure-copy {
      margin: 0;
      font-size: 24px;
      line-height: 1.45;
    }
    .failure-copy strong { color: var(--warning); }
    .nav {
      position: absolute;
      left: 96px;
      right: 96px;
      bottom: 34px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--subtle);
      font-family: var(--font-mono);
      font-size: 20px;
    }
    .nav-links { display: flex; gap: 12px; }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      background: var(--bg-soft);
    }
  </style>
</head>
<body>
  <div class="stage">
    <main>
      <p class="eyebrow">PATH · 05</p>
      <h1>一条七步研究路径，<br>把模糊搜索变成<em>可冻结结果</em></h1>

      <div class="scope" aria-label="研究边界">
        <strong>中国大陆</strong><span class="scope-dot"></span>
        <strong>天猫</strong><span class="scope-dot"></span>
        <strong>猫狗用品</strong><span class="scope-dot"></span>
        <span>5 个起始词簇</span><span class="scope-dot"></span>
        <span>五天窗口</span>
      </div>

      <section class="process-wrap" aria-label="七步研究路径">
        <div class="rail" aria-hidden="true"></div>
        <div class="steps">
          <article class="step">
            <div class="step-mark">01</div>
            <h2>锁定边界</h2>
            <p>范围口径</p>
          </article>
          <article class="step">
            <div class="step-mark">02</div>
            <h2>来源预检</h2>
            <p>可读性记录</p>
          </article>
          <article class="step">
            <div class="step-mark">03</div>
            <h2>配额扫描</h2>
            <p>来源池</p>
          </article>
          <article class="step">
            <div class="step-mark">04</div>
            <h2>人工确认</h2>
            <p>关键证据</p>
          </article>
          <article class="step">
            <div class="step-mark">05</div>
            <h2>候选分流</h2>
            <p>候选状态</p>
          </article>
          <article class="step">
            <div class="step-mark">06</div>
            <h2>台账冻结</h2>
            <p>冻结版本</p>
          </article>
          <article class="step">
            <div class="step-mark">07</div>
            <h2>派生结果</h2>
            <p>摘要 · 报告 · 决定</p>
          </article>
        </div>

        <div class="quota" aria-label="扫描配额">
          <span>每词簇最多 <strong>6</strong> 条有效来源</span>
          <span>全轮最多 <strong>30</strong> 条</span>
          <span>最多 <strong>8</strong> 个候选</span>
          <span>最多 <strong>2</strong> 轮扩展</span>
        </div>

        <aside class="failure-route" aria-label="预检失败旁路">
          <p class="failure-label">预检失败旁路</p>
          <p class="failure-copy">预检失败即停止扫描，仍交付<strong>失败台账 · 0 份报告 · 停止决定</strong></p>
        </aside>
      </section>
    </main>

    <nav class="nav" aria-label="幻灯片导航">
      <span>5 / 11</span>
      <div class="nav-links">
        <a href="p04.html" aria-label="上一页">← 上一页</a>
        <a href="p06.html" aria-label="下一页">下一页 →</a>
      </div>
    </nav>
  </div>

  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p04.html';
      if (event.key === 'ArrowRight') location.href = 'p06.html';
    });
  </script>
</body>
</html>
