<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI新品机会雷达 · 单一事实源</title>
  <style>
    :root {
  --bg: #07111F;
  --bg-soft: #0C1728;
  --surface: #101D30;
  --surface-2: #15243A;
  --text: #F5F8FC;
  --muted: #9CB0C5;
  --subtle: #60738A;
  --accent: #35D0BA;
  --accent-soft: #183D3A;
  --success: #54D98C;
  --warning: #F4B860;
  --danger: #FF7171;
  --line: #263952;
  --white: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.28);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 40px;
  --space-1: 12px;
  --space-2: 20px;
  --space-3: 32px;
  --space-4: 48px;
  --space-5: 72px;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, monospace;
}
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    body { overflow-x: hidden; }
    .stage {
      position: relative;
      width: 1920px;
      min-height: 1080px;
      transform-origin: top left;
      overflow: hidden;
      background:
        radial-gradient(circle at 48% 52%, var(--accent-soft), transparent 28%),
        linear-gradient(135deg, var(--bg), var(--bg-soft));
    }
    .page { padding: 80px 118px 100px; }
    .eyebrow { color: var(--accent); font-family: var(--font-mono); font-size: 16px; letter-spacing: .18em; }
    h1 { margin: 18px 0 0; font-size: 66px; line-height: 1.12; letter-spacing: -.035em; max-width: 1480px; }
    h1 em { color: var(--accent); font-style: normal; }
    .architecture { display: grid; grid-template-columns: 1fr 110px 1.08fr; align-items: center; margin-top: 70px; }
    .chain { display: grid; grid-template-columns: repeat(4, 1fr); align-items: stretch; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .object { position: relative; min-height: 270px; padding: 42px 24px 26px; border-right: 1px solid var(--line); }
    .object:last-child { border-right: 0; }
    .object::after { content: "→"; position: absolute; right: -13px; top: 114px; color: var(--accent); font-size: 28px; z-index: 2; }
    .object:last-child::after { display: none; }
    .code { font-family: var(--font-mono); color: var(--accent); font-size: 22px; letter-spacing: .12em; }
    .object h2 { margin: 22px 0 12px; font-size: 27px; }
    .object p { margin: 0; color: var(--muted); font-size: 22px; line-height: 1.5; }
    .bridge { text-align: center; color: var(--accent); font-size: 34px; }
    .freeze { min-height: 360px; padding: 38px 42px; border: 1px solid var(--accent); border-radius: var(--radius-lg); box-shadow: 0 30px 70px var(--shadow); background: linear-gradient(145deg, var(--surface), var(--bg-soft)); }
    .freeze-label { font-family: var(--font-mono); color: var(--accent); font-size: 16px; letter-spacing: .15em; }
    .freeze h2 { margin: 18px 0 20px; font-size: 34px; }
    .freeze ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
    .freeze li { color: var(--muted); font-size: 22px; line-height: 1.45; padding-left: 20px; position: relative; }
    .freeze li::before { content: ""; position: absolute; left: 0; top: .65em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .outputs { display: flex; gap: 18px; margin-top: 28px; }
    .output { flex: 1; padding: 18px 20px; text-align: center; border-top: 1px solid var(--line); color: var(--text); font-size: 22px; }
    .rule { margin-top: 40px; display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 23px; }
    .rule strong { color: var(--warning); font-weight: 650; }
    .nav { position: absolute; right: 112px; bottom: 48px; display: flex; align-items: center; gap: 18px; font-size: 16px; }
    .nav a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .nav .count { color: var(--accent); font-family: var(--font-mono); min-width: 60px; text-align: center; }
  </style>
</head>
<body>
  <div class="stage">
    <main class="page">
      <div class="eyebrow">ARCHITECTURE / 单一事实源</div>
      <h1>一个冻结台账，保证摘要与报告<em>只讲同一套事实</em></h1>
      <section class="architecture">
        <div class="chain">
          <div class="object"><div class="code">SRC</div><h2>来源</h2><p>页面、报告<br>可读状态</p></div>
          <div class="object"><div class="code">EVD</div><h2>证据</h2><p>最短引文<br>类别与定位</p></div>
          <div class="object"><div class="code">CLM</div><h2>判断</h2><p>事实、推断<br>未知与方向</p></div>
          <div class="object"><div class="code">CND</div><h2>候选</h2><p>需求场景<br>门槛与终态</p></div>
        </div>
        <div class="bridge">→</div>
        <div class="freeze">
          <div class="freeze-label">FROZEN SNAPSHOT</div>
          <h2>轮次内一次冻结</h2>
          <ul>
            <li>固定边界</li><li>运行与失败记录</li>
            <li>对象及关系</li><li>全部达标候选</li>
            <li>报告选择轨迹</li><li>唯一决定输入</li>
          </ul>
          <div class="outputs"><div class="output">全部达标摘要</div><div class="output">0—5 份完整报告</div></div>
        </div>
      </section>
      <div class="rule"><strong>只读派生</strong><span>每份材料绑定同一轮次、同一版本；冻结后改变事实只能新建轮次。</span></div>
    </main>
    <nav class="nav" aria-label="幻灯片导航">
      <a href="p07.html">← 上一页</a><span class="count">8 / 11</span><a href="p09.html">下一页 →</a>
    </nav>
  </div>
  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p07.html';
      if (event.key === 'ArrowRight') location.href = 'p09.html';
    });
  </script>
</body>
</html>
