<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真正的缺口不是没有数据，而是判断无法被复核</title>
  <style>
    :root {
  --bg: #07111F;
  --bg-soft: #0C1728;
  --surface: #101D30;
  --surface-2: #15243A;
  --text: #F5F8FC;
  --muted: #9CB0C5;
  --subtle: #60738A;
  --accent: #35D0BA;
  --accent-soft: #183D3A;
  --success: #54D98C;
  --warning: #F4B860;
  --danger: #FF7171;
  --line: #263952;
  --white: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.28);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 40px;
  --space-1: 12px;
  --space-2: 20px;
  --space-3: 32px;
  --space-4: 48px;
  --space-5: 72px;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, monospace;
}

    /* 基调：深海蓝背景、青绿色为唯一主强调色；高层阅读型、低装饰、强对齐。 */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .stage {
      width: 1920px;
      min-height: 1080px;
      transform-origin: top left;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 77% 38%, var(--accent-soft), transparent 34%),
        linear-gradient(135deg, var(--bg), var(--bg-soft));
      padding: 72px 96px 52px;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 96px 96px;
      mask-image: linear-gradient(to bottom, transparent, var(--bg) 38%, transparent 88%);
    }
    .content { position: relative; z-index: 1; }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 1540px;
      margin: 0;
      font-size: 68px;
      line-height: 1.12;
      letter-spacing: -.035em;
      font-weight: 760;
    }
    h1 em {
      color: var(--accent);
      font-style: normal;
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr 112px 1fr;
      align-items: stretch;
      gap: 26px;
      margin-top: 64px;
    }
    .panel {
      min-height: 480px;
      padding: 38px 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: 0 28px 60px var(--shadow);
    }
    .panel.current { border-top: 4px solid var(--warning); }
    .panel.traceable { border-top: 4px solid var(--accent); }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .panel-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
      font-weight: 700;
    }
    .status {
      padding: 9px 16px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--bg-soft);
      font-size: 22px;
      line-height: 1.2;
    }
    .current .status { color: var(--warning); }
    .traceable .status { color: var(--accent); }
    .chain {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 12px;
      min-height: 156px;
    }
    .node {
      min-height: 112px;
      display: grid;
      place-items: center;
      padding: 18px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      color: var(--text);
      text-align: center;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 650;
    }
    .current .node:nth-child(2),
    .current .node:nth-child(4) {
      transform: translateY(24px);
      border-style: dashed;
      color: var(--muted);
    }
    .traceable .node { border-color: var(--accent); }
    .links {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 20px 10% 0;
    }
    .link {
      height: 3px;
      background: var(--accent);
      position: relative;
    }
    .link::after {
      content: "";
      position: absolute;
      right: -1px;
      top: -6px;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 13px solid var(--accent);
    }
    .breaks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin: 20px 10% 0;
    }
    .break {
      height: 3px;
      background: repeating-linear-gradient(90deg, var(--danger) 0 22px, transparent 22px 36px);
      opacity: .78;
    }
    .panel-note {
      margin: 40px 0 0;
      color: var(--muted);
      font-size: 24px;
      line-height: 1.55;
    }
    .panel-note strong { color: var(--text); }
    .divider {
      display: grid;
      place-items: center;
      color: var(--danger);
    }
    .divider-mark {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      border: 1px solid var(--danger);
      border-radius: 50%;
      background: var(--bg-soft);
      font-family: var(--font-mono);
      font-size: 38px;
      font-weight: 800;
    }
    .consequence {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 24px;
      line-height: 1.4;
    }
    .consequence strong { color: var(--warning); }
    .arrow { color: var(--subtle); font-family: var(--font-mono); }
    .nav {
      position: absolute;
      left: 96px;
      right: 96px;
      bottom: 34px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--subtle);
      font-family: var(--font-mono);
      font-size: 20px;
    }
    .nav-links { display: flex; gap: 12px; }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      background: var(--bg-soft);
    }
  </style>
</head>
<body>
  <div class="stage">
    <main class="content">
      <p class="eyebrow">THE REAL GAP · 03</p>
      <h1>真正的缺口不是“没有数据”，<br>而是判断<em>无法被复核</em></h1>

      <section class="compare" aria-label="不可复核现状与可追溯证据链对照">
        <article class="panel current">
          <div class="panel-head">
            <h2 class="panel-title">当前：断裂的判断链</h2>
            <span class="status">无法回源</span>
          </div>
          <div class="chain">
            <div class="node">市场信号</div>
            <div class="node">个人经验</div>
            <div class="node">产品选择</div>
            <div class="node">开发投入</div>
          </div>
          <div class="breaks" aria-hidden="true">
            <span class="break"></span><span class="break"></span><span class="break"></span>
          </div>
          <p class="panel-note">信息集中在已有行业与国内线上渠道；新品类又<strong>没有内部历史数据</strong>。</p>
        </article>

        <div class="divider" aria-hidden="true">
          <div class="divider-mark">≠</div>
        </div>

        <article class="panel traceable">
          <div class="panel-head">
            <h2 class="panel-title">需要：完整的证据链</h2>
            <span class="status">可回源</span>
          </div>
          <div class="chain">
            <div class="node">市场信号</div>
            <div class="node">可回源事实</div>
            <div class="node">选择判断</div>
            <div class="node">开发投入</div>
          </div>
          <div class="links" aria-hidden="true">
            <span class="link"></span><span class="link"></span><span class="link"></span>
          </div>
          <p class="panel-note">事实、推断与未知必须分开，任何人都能沿同一路径检查判断依据。</p>
        </article>
      </section>

      <div class="consequence" aria-label="现状后果">
        <strong>趋势发现慢</strong><span class="arrow">→</span>
        <span>选择范围窄</span><span class="arrow">→</span>
        <span>错过窗口</span><span class="arrow">→</span>
        <span>开发后仍需高成本试错</span>
      </div>
    </main>

    <nav class="nav" aria-label="幻灯片导航">
      <span>3 / 11</span>
      <div class="nav-links">
        <a href="p02.html" aria-label="上一页">← 上一页</a>
        <a href="p04.html" aria-label="下一页">下一页 →</a>
      </div>
    </nav>
  </div>

  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();
    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p02.html';
      if (event.key === 'ArrowRight') location.href = 'p04.html';
    });
  </script>
</body>
</html>
