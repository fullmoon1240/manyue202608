<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI新品机会雷达 · 06</title>
  <style>
:root {
  --bg: #07111F;
  --bg-soft: #0C1728;
  --surface: #101D30;
  --surface-2: #15243A;
  --text: #F5F8FC;
  --muted: #9CB0C5;
  --subtle: #60738A;
  --accent: #35D0BA;
  --accent-soft: #183D3A;
  --success: #54D98C;
  --warning: #F4B860;
  --danger: #FF7171;
  --line: #263952;
  --white: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.28);
  --radius-sm: 14px;
  --radius-md: 24px;
  --radius-lg: 40px;
  --space-1: 12px;
  --space-2: 20px;
  --space-3: 32px;
  --space-4: 48px;
  --space-5: 72px;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter, system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, monospace;
}

    /* 基调：深海蓝背景、青绿色为唯一主强调色；高层阅读型、低装饰、强对齐。 */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow-x: hidden;
    }
    .stage {
      position: relative;
      width: 1920px;
      min-height: 1080px;
      overflow: hidden;
      transform-origin: top left;
      background:
        radial-gradient(circle at 50% 61%, var(--accent-soft) 0, var(--bg) 31%),
        linear-gradient(145deg, var(--bg-soft) 0%, var(--bg) 66%);
    }
    .frame {
      position: absolute;
      inset: 52px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }
    .eyebrow {
      position: absolute;
      top: 78px;
      left: 96px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.16em;
    }
    .eyebrow::before {
      content: "";
      width: 44px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }
    .nav {
      position: absolute;
      z-index: 8;
      top: 78px;
      right: 88px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.08em;
    }
    .page-no { color: var(--muted); }
    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      text-decoration: none;
    }
    .headline {
      position: absolute;
      z-index: 4;
      top: 134px;
      left: 112px;
      width: 1650px;
    }
    h1 {
      margin: 0;
      max-width: 1570px;
      font-size: 66px;
      line-height: 1.12;
      letter-spacing: -0.025em;
      font-weight: 760;
    }
    h1 em {
      color: var(--accent);
      font-style: normal;
    }
    .subline {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.4;
    }
    .gate-system {
      position: absolute;
      z-index: 3;
      left: 112px;
      right: 112px;
      top: 342px;
      height: 620px;
    }
    .condition {
      position: absolute;
      width: 500px;
      min-height: 132px;
      padding: 22px 26px 22px 76px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 18px 42px var(--shadow);
    }
    .condition::before {
      content: "✓";
      position: absolute;
      top: 29px;
      left: 26px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
    }
    .condition b {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 24px;
      line-height: 1.3;
    }
    .condition span {
      color: var(--muted);
      font-size: 22px;
      line-height: 1.35;
    }
    .c1, .c4 { top: 0; }
    .c2, .c5 { top: 182px; }
    .c3, .c6 { top: 364px; }
    .c1, .c2, .c3 { left: 0; }
    .c4, .c5, .c6 { right: 0; }
    .connector {
      position: absolute;
      width: 114px;
      height: 2px;
      background: var(--line);
    }
    .connector::after {
      content: "";
      position: absolute;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
    }
    .connector.left { left: 500px; }
    .connector.left::after { right: 0; }
    .connector.right { right: 500px; }
    .connector.right::after { left: 0; }
    .connector.row1 { top: 65px; }
    .connector.row2 { top: 247px; }
    .connector.row3 { top: 429px; }
    .gate {
      position: absolute;
      left: 50%;
      top: 76px;
      width: 390px;
      height: 390px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: var(--bg-soft);
      box-shadow: 0 0 0 24px var(--accent-soft), 0 24px 70px var(--shadow);
    }
    .gate::before,
    .gate::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 70px;
      background: var(--accent);
    }
    .gate::before { top: -71px; }
    .gate::after { bottom: -71px; }
    .gate-copy { text-align: center; }
    .gate-label {
      display: block;
      margin-bottom: 16px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .gate strong {
      display: block;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 48px;
      line-height: 1.1;
    }
    .reject-route {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 16px 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--muted);
      font-size: 22px;
      line-height: 1.2;
    }
    .reject-route b {
      color: var(--warning);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame" aria-hidden="true"></div>
    <div class="eyebrow">硬门槛 · 人工回源</div>

    <nav class="nav" aria-label="演示文稿导航">
      <span class="page-no">06 / 11</span>
      <a class="nav-link" href="p05.html">← 上一页</a>
      <a class="nav-link" href="p07.html">下一页 →</a>
    </nav>

    <header class="headline">
      <h1>单一热度、单一转载或 AI 判断，<br>都不能让候选<em>过门槛</em></h1>
      <p class="subline">六项硬条件，缺一项即不通过。</p>
    </header>

    <main class="gate-system" aria-label="候选达标硬门槛">
      <section class="condition c1">
        <b>需求 / 行为证据</b>
        <span>一类有效信号</span>
      </section>
      <section class="condition c2">
        <b>问题 / 价格 / 竞争证据</b>
        <span>一类有效信号</span>
      </section>
      <section class="condition c3">
        <b>独立根来源 ≥ 2</b>
        <span>同源不重复计数</span>
      </section>

      <div class="connector left row1" aria-hidden="true"></div>
      <div class="connector left row2" aria-hidden="true"></div>
      <div class="connector left row3" aria-hidden="true"></div>

      <section class="gate" aria-label="候选达标结果">
        <div class="gate-copy">
          <span class="gate-label">PASS GATE</span>
          <strong>Eligible<br>(CND)</strong>
        </div>
      </section>

      <div class="connector right row1" aria-hidden="true"></div>
      <div class="connector right row2" aria-hidden="true"></div>
      <div class="connector right row3" aria-hidden="true"></div>

      <section class="condition c4">
        <b>候选特定反证</b>
        <span>反证、限制或未知可见</span>
      </section>
      <section class="condition c5">
        <b>100% 人工回源</b>
        <span>核验关键证据、事实与独立性</span>
      </section>
      <section class="condition c6">
        <b>业务关键项不补造</b>
        <span>战略、供应链、渠道、成本、利润、合规：未知，待业务验证</span>
      </section>

      <div class="reject-route"><b>未满足</b><span>→ 观察池或已排除</span></div>
    </main>
  </div>
  <script>
    function fit() {
      var s = innerWidth / 1920;
      var stage = document.querySelector('.stage');
      stage.style.transform = 'scale(' + s + ')';
      document.body.style.height = (stage.offsetHeight * s) + 'px';
    }
    addEventListener('resize', fit); fit();

    addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') location.href = 'p05.html';
      if (event.key === 'ArrowRight') location.href = 'p07.html';
    });
  </script>
</body>
</html>
